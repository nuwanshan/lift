<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121517">
<meta name="description" content="Daily training plan and logbook, works offline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Lift</title>
<style>
:root{
  --bg:#121517; --surface:#1B2023; --surface-2:#252B2F; --line:#323A3F;
  --text:#EEF1EE; --muted:#98A29B; --accent:#F0974C; --accent-ink:#1A1000;
  --ok:#5CC9B2; --ok-bg:#163630; --warn:#F2C35A; --warn-bg:#352B12; --bad:#EE7F72; --bad-bg:#3B1F1C;
  --gold:#F2C35A; --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0));-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:.01em}
h1{font-size:1.45rem;line-height:1.2}
h2{font-size:1.05rem}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.top{padding:16px 0 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top a{color:var(--accent);text-decoration:none;font-size:.9rem;font-weight:600}
.nav2{gap:8px;flex:0 0 auto}.nav2 a{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:1.6rem;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card.hero{border-color:var(--accent)}
.banner{border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:.92rem}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.info{background:var(--surface-2);color:var(--text)}
.banner b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent);color:var(--accent-ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
button,.btn{font:inherit;border:0;border-radius:12px;cursor:pointer;touch-action:manipulation}
.btn{display:block;width:100%;text-align:center;padding:15px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:var(--surface-2);color:var(--text);font-weight:600}
.btn.ok{background:var(--ok);color:#06231D}
.btn.sm{padding:10px 12px;font-size:.92rem;width:auto;display:inline-block}
.btn:disabled{opacity:.45}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ex-list{margin:10px 0 14px;padding:0;list-style:none}
.ex-list li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.95rem}
.ex-list li:first-child{border-top:0}
.ex-list .w{color:var(--muted);white-space:nowrap;text-align:right}
.week{display:flex;gap:5px;margin:4px 0 12px}
.wd{flex:1;min-width:0;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 0 5px;background:var(--surface);color:inherit;text-decoration:none}
.wd .l{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wd .c{font-weight:700;font-size:.9rem;min-height:1.2em}
.wd.today{border:2px solid var(--accent)}
.wd.done{background:var(--ok-bg);border-color:var(--ok)}
.wd.done .c{color:var(--ok)}
.wd.missed .c{color:var(--bad)}
.wd.off{opacity:.35}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.ticks{display:grid;gap:8px}
.tick{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:12px;padding:10px 12px;min-height:52px}
.tick .t{font-weight:600}
.tick .s{font-size:.8rem;color:var(--muted)}
.chk{width:44px;height:44px;flex:0 0 44px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font-size:1.25rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06231D}
.chk.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
input::placeholder{color:#6E7872}
.wt{width:92px;text-align:center;font-size:1.05rem}
/* session */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.ex.alldone{border-color:var(--ok)}
.ex h3{font-size:1.15rem;line-height:1.25}
.ex .tgt{color:var(--accent);font-weight:700;font-size:.95rem;margin-top:2px}
.ex .hint{font-size:.84rem;color:var(--muted);margin-top:6px}
.ex .hint b{color:var(--text);font-weight:600}
.ex .up{color:var(--ok)}
.ex .plates{font-size:.8rem;color:var(--muted);margin-top:4px}
.sets{margin-top:10px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;align-items:center;padding:4px 0}
.set.r2{grid-template-columns:30px 1fr 48px}
.set .n{color:var(--muted);font-weight:700;text-align:center;font-size:.9rem}
.set input{text-align:center;font-size:1.1rem;padding:11px 6px}
.set.done input{background:transparent;border-color:transparent;color:var(--ok);font-weight:700}
.set .chk{width:48px;height:48px}
.colh{display:grid;grid-template-columns:30px 1fr 1fr 48px;gap:8px;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.colh.r2{grid-template-columns:30px 1fr 48px}
.pr{color:var(--gold);font-size:.75rem;font-weight:700;grid-column:2 / -1;margin-top:-2px}
.linkbtn{background:none;color:var(--muted);padding:8px 0;font-size:.88rem}
.linkbtn.acc{color:var(--accent);font-weight:600}
.sess-head{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
#rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0));z-index:30;display:none;background:var(--accent);color:var(--accent-ink);padding:12px 16px;box-shadow:0 -4px 18px rgba(0,0,0,.4)}
#rest.show{display:block}
#rest .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
#rest .tm{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#rest button{background:rgba(0,0,0,.18);color:inherit;padding:10px 12px;font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;color:var(--muted);text-decoration:none;font-size:.74rem;font-weight:600;letter-spacing:.03em}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--accent)}
/* plan */
.ph{margin:18px 0 8px}
.wk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.wk.cur{border-color:var(--accent)}
.wk .wh{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.wk .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wk .days a{text-align:center;text-decoration:none;color:var(--text);background:var(--surface-2);border-radius:8px;padding:5px 0;font-size:.78rem;font-weight:700}
.wk .days a .l{display:block;font-size:.58rem;color:var(--muted);font-weight:600}
.wk .days a.rest{color:var(--muted);font-weight:500}
.wk .days a.done{background:var(--ok-bg);color:var(--ok)}
.wk .days a.today{outline:2px solid var(--accent)}
.wk .days a.x{background:transparent;color:transparent}
.loglist .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.loglist .it:first-child{border-top:0}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.mt{margin-top:12px}.mb0{margin-bottom:0}
.swap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.swap button{background:var(--surface-2);color:var(--text);padding:12px 6px;font-weight:600;font-size:.9rem}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'+ ';color:var(--accent)}
details[open] summary::before{content:'− '}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted" style="padding:40px 0;text-align:center">Loading…</p></div>
<div id="rest"><div class="in">
  <div><div class="small" style="font-weight:700;opacity:.8">REST</div><div class="tm" id="restTm">1:30</div></div>
  <div class="row"><button id="restMinus" type="button">−15</button><button id="restPlus" type="button">+15</button><button id="restSkip" type="button">Skip</button></div>
</div></div>
<nav class="tabs"><div class="in">
  <a href="#/today" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9v6M18 9v6M3 11v2M21 11v2M6 12h12"/></svg>Today</a>
  <a href="#/plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</a>
  <a href="#/log" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M21 19H3"/></svg>Progress</a>
</div></nav>
<div class="toast" id="toast"></div>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
